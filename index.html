<style>

.btn.o{background:none;color:var(--ink);border:1px solid var(--line);box-shadow:none}.btn.s{padding:8px 14px;min-height:38px;font-size:14px;border-radius:12px}.btn:disabled{opacity:.4;cursor:not-allowed}

input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--soft);min-height:44px}

.hd input{flex:1 1 160px;max-width:300px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0}.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 18px;white-space:nowrap;cursor:pointer;min-height:40px;font-weight:600;transition:border-color .2s}.chip:hover{border-color:rgba(255,90,30,.6)}.chip.on{background:var(--gr);color:#fff;border-color:transparent}

.vis{position:relative;aspect-ratio:4/3;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 78% 14%,hsl(var(--h) 95% 58%/.55),transparent 56%),radial-gradient(circle at 12% 92%,hsl(calc(var(--h) + 40) 90% 50%/.35),transparent 52%),linear-gradient(145deg,hsl(var(--h) 55% 20%),hsl(var(--h) 60% 7%))}
.vis::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.2) 1px,transparent 1px);background-size:16px 16px;-webkit-mask-image:linear-gradient(180deg,#000,transparent 85%);mask-image:linear-gradient(180deg,#000,transparent 85%)}
.vis::after{content:"";position:absolute;width:58%;aspect-ratio:1;border-radius:50%;background:hsl(var(--h) 90% 60%/.16);border:1px solid rgba(255,255,255,.18)}
.vis .em{position:relative;z-index:1;font-size:78px;line-height:1;filter:drop-shadow(0 16px 18px rgba(0,0,0,.55));transition:transform .3s}
.card:hover .em,.mini:hover .em{transform:scale(1.13) rotate(-5deg)}
.pi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.vis .cat{position:absolute;top:12px;left:12px;z-index:2;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.15);color:#fff;border-radius:10px;padding:5px 11px;font-size:12px;font-weight:700}
.vis .off{position:absolute;top:12px;right:12px;z-index:2;background:var(--gr);color:#fff;border-radius:10px;padding:5px 9px;font-size:12px;font-weight:800}
.cb{padding:16px 18px 18px}.cb>b{font-size:18px;letter-spacing:-.01em;display:block}.cb small{color:var(--mut);display:block}
.pr{margin:6px 0 2px}.big2{font-size:20px;font-weight:800;color:var(--acc)}s{color:var(--mut)}
.tg{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 10px}.tc{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:12px;color:var(--mut)}
.cta{margin-top:12px}.cta .btn{display:block;text-align:center}
.so{display:inline-block;margin-top:6px;border:1px solid var(--bad);color:var(--bad);border-radius:8px;padding:0 8px;font-size:12px;font-weight:700}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.mod{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:20;display:grid;place-items:center;padding:12px}
.mod>div{background:var(--card);border:1px solid var(--line);border-radius:24px;max-width:480px;width:100%;max-height:92vh;overflow:auto;padding:18px}
.mod .vis{aspect-ratio:16/10;border-radius:18px;margin:12px 0}.mod .vis .em{font-size:96px}
.sw{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);cursor:pointer;display:inline-block;margin:0 6px 6px 0}.sw.on{outline:3px solid var(--acc);outline-offset:2px}
.sz{min-width:52px;padding:8px 10px;border:1px solid var(--line);background:var(--soft);border-radius:12px;cursor:pointer;margin:0 6px 6px 0;min-height:40px}
.sz.on{background:var(--gr);color:#fff;border-color:transparent}.sz:disabled{opacity:.45;text-decoration:line-through;cursor:not-allowed}
label{display:block;margin:10px 0 4px;color:var(--mut);font-size:14px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 0}
.st{display:inline-block;padding:3px 12px;border-radius:99px;background:rgba(255,90,30,.14);color:var(--acc);font-size:13px;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gr);color:#fff;padding:12px 20px;border-radius:14px;z-index:30;max-width:90vw;font-weight:600}
.qr{max-width:260px;width:100%;display:block;margin:10px auto;border:1px solid var(--line);border-radius:14px;background:#fff}
.big{font-size:28px;font-weight:800}.mut{color:var(--mut)}.ok{color:var(--ok)}.bad{color:var(--bad)}a{color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:7px;border-bottom:1px solid var(--line)}
.tw{overflow-x:auto}.tw input{width:70px;padding:6px;min-height:36px}
.pill{display:inline-flex;gap:8px;align-items:center;border:1px solid rgba(255,90,30,.5);background:rgba(255,90,30,.1);color:#ff8a4d;border-radius:99px;padding:7px 15px;font-size:13px;font-weight:600}.pill i{width:7px;height:7px;border-radius:50%;background:#ff5a1f}
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:30px;align-items:center;padding:40px 0 14px}
@media(max-width:820px){.hero{grid-template-columns:1fr;padding-top:26px}}
.hero h1{font-size:clamp(36px,6.4vw,64px);line-height:1.02;letter-spacing:-.035em;font-weight:800;margin:18px 0}
.hero h1 em{font-style:normal;background:var(--gr);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mut);font-size:17px;max-width:480px}
.ctas{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0 16px}
.bd{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--mut)}
.gl{border:1px solid var(--line);border-radius:28px;padding:18px;background:linear-gradient(160deg,rgba(255,110,30,.13),var(--soft));box-shadow:0 34px 80px -34px rgba(255,90,20,.5)}
.dots{display:flex;gap:6px;align-items:center;color:var(--mut);font-size:13px;margin-bottom:12px}.dots i{width:10px;height:10px;border-radius:50%;background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840;margin-right:8px}
.or{background:var(--gr);color:#fff;border-radius:20px;padding:16px 20px}.or small{opacity:.92}.or b{display:block;font-size:32px;letter-spacing:-.02em}
.tls{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0 16px}
.tl{border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:var(--soft)}.tl small{color:var(--mut);display:block}.tl b{display:flex;gap:7px;align-items:center}
.dt{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.mt{font-size:12px;letter-spacing:.08em;font-weight:700;color:var(--mut);margin:4px 0 10px}
.strip{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x mandatory}
.mini{flex:0 0 138px;cursor:pointer;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--card);scroll-snap-align:start}
.mini .vis{aspect-ratio:1/1}.mini .em{font-size:52px}.mini .off{top:8px;right:8px;font-size:11px;padding:3px 7px}
.mini b{display:block;padding:8px 10px;font-size:13px;line-height:1.3}
.sec{text-align:center;margin:50px 0 4px}.sec h2{font-size:clamp(28px,4.6vw,42px);letter-spacing:-.03em;margin:14px 0 0;font-weight:800}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;border:0;background:#22c55e;color:#fff;box-shadow:0 10px 28px rgba(34,197,94,.5);z-index:15;display:grid;place-items:center;cursor:pointer}
</style></head><body><div id="pg"></div><div id="app"></div>
<script>
const $=s=>document.querySelector(s),rp=n=>'Rp'+Math.round(n).toLocaleString('id-ID'),KEY='tokodemo1';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST={menunggu:'Menunggu Pembayaran',verifikasi:'Menunggu Verifikasi',dibayar:'Sudah Dibayar',dikemas:'Sedang Dikemas',dikirim:'Dikirim',selesai:'Selesai',dibatalkan:'Dibatalkan',kedaluwarsa:'Kedaluwarsa'};
const PAID=['dibayar','dikemas','dikirim','selesai'];
const W={Hitam:'#222',Putih:'#f4f1ea',Krem:'#e6d5b8',Navy:'#1f2f4d',Olive:'#6b6b3a',Merah:'#a3342b',Abu:'#8a8a8a',Biru:'#2b6cb0',Hijau:'#2f855a',Kuning:'#ecc94b',Coklat:'#7b4a2b',Pink:'#ed64a6',Orange:'#ff7a1a'};
const KOTA={Surabaya:'sby',Sidoarjo:'jt',Malang:'jt',Jakarta:'jw',Bandung:'jw',Semarang:'jw',Denpasar:'lj',Makassar:'lj',Medan:'lj'};
const TR={JNE:{sby:9000,jt:10000,jw:18000,lj:32000,e:'2–4 hari'},TIKI:{sby:10000,jt:11000,jw:19000,lj:34000,e:'2–5 hari'},Wahana:{sby:8000,jt:9000,jw:16000,lj:28000,e:'3–6 hari'}};
function seed(){
 const F=(n,k,h,d,g,e,w,u)=>({n,k,h,d,g,e,w,u,t:'fashion',sold:0,v:{}});
 const M=(n,h,g,e,s,luar)=>({n,k:'Makanan',h,d:0,g,e,t:'makanan',luar,habis:false,sold:0,v:{porsi:{s,r:0}}});
 const L=[F('Kaos Polos Premium','Pria',89000,69000,200,'👕',['Hitam','Putih','Krem'],['S','M','L','XL']),
 F('Kemeja Linen Lengan Panjang','Pria',189000,149000,350,'👔',['Putih','Navy','Olive'],['M','L','XL']),
 F('Celana Chino Slim','Pria',229000,0,500,'👖',['Krem','Navy','Hitam'],['30','32','34']),
 F('Dress Midi Floral','Wanita',259000,199000,400,'👗',['Merah','Krem','Navy'],['S','M','L']),
 F('Blouse Satin','Wanita',179000,0,250,'👚',['Putih','Krem','Hitam'],['S','M','L']),
 F('Kaos Anak Katun','Anak',69000,55000,150,'🧒',['Merah','Navy','Putih'],['2','4','6','8']),
 F('Tote Bag Kanvas','Aksesori',79000,0,300,'👜',['Krem','Hitam'],['All']),
 F('Topi Baseball','Aksesori',65000,49000,120,'🧢',['Hitam','Navy','Olive'],['All']),
 M('Nasi Ayam Bakar',28000,450,'🍗',20,false),M('Soto Ayam Lamongan',25000,500,'🍲',15,false),
 M('Brownies Kukus',35000,300,'🍰',10,true),M('Sambal Bawang Botol',40000,250,'🌶️',30,true)];
 L.forEach((p,i)=>{p.id='p'+(i+1);if(p.t=='fashion')p.w.forEach((w,a)=>p.u.forEach((u,b)=>p.v[w+'|'+u]={s:(i*7+a*5+b*3)%11+1,r:0}))});
 L[0].v['Putih|L'].s=0;
 return{p:L,o:[],cart:[],qris:'',kurir:{JNE:1,TIKI:1,Wahana:1,Gojek:1}}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.p)return s}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Penyimpanan penuh. Pakai gambar QRIS yang lebih kecil.')}sync()}
let S=load(),V={q:'',cat:'Semua',tab:'ver',open:null,sel:{q:1},kota:'',kur:''};
const API_URL='https://script.google.com/macros/s/AKfycbw6mibz3DwBAztRTpQVXPl6p_zpw5J2yYA5E8GxhHvY6N4OPRiWuHTu5Auu1jwbjbEGcg/exec';/* tempel URL Web App Google Sheet di sini agar pembeli ikut melihat stok terbaru */
const me=()=>(S.users||[]).find(u=>u.u==sessionStorage.getItem('adm'))||null,adm=()=>!!me();
const P=id=>S.p.find(p=>p.id==id),avail=(p,k)=>p.habis?0:Math.max(0,p.v[k].s-p.v[k].r),tot=p=>Object.keys(p.v).reduce((a,k)=>a+avail(p,k),0),price=p=>p.d||p.h;
const lines=()=>S.cart.map(c=>({...c,p:P(c.pid)}));
function toast(m){const d=document.createElement('div');d.className='toast';d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}
function expire(){let ch=0;S.o.forEach(o=>{if(o.status=='menunggu'&&Date.now()>o.exp){rel(o);o.status='kedaluwarsa';ch=1}});if(ch)save()}
function rel(o){o.items.forEach(i=>{const p=P(i.pid);if(p)p.v[i.key].r=Math.max(0,p.v[i.key].r-i.q)})}
const hm=t=>new Date(t).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
function route(){return location.hash.slice(1)||'/'}
function go(h){location.hash=h}
function draw(){expire();const r=route();let c='';
 if(r=='/')c=home();else if(r=='/keranjang')c=cart();else if(r=='/checkout')c=checkout();else if(r.startsWith('/bayar/'))c=pay(r.slice(7));else if(r=='/cek')c=cek();else if(r=='/admin')c=admin();else c=home();
 const n=S.cart.reduce((a,c)=>a+c.q,0);
 $('#app').innerHTML=`<header><div class="hd"><div class="logo" onclick="go('/')"><span class="lm">D</span>Dapur&nbsp;<span>Mama</span></div><input id="q" placeholder="Cari produk…" value="${esc(V.q)}" oninput="V.q=this.value;if(route()!='/')go('/');else grid()"><button class="ib" onclick="theme()" aria-label="Ganti tema">${document.documentElement.dataset.theme=='dark'?'☀':'☾'}</button><button class="btn o s" onclick="go('/cek')">Cek pesanan</button><button class="btn s" onclick="go('/keranjang')">Keranjang (${n})</button></div></header><div class="w">${c}<p style="margin-top:30px"><a href="#/admin" class="mut">Masuk admin</a></p></div>${V.open?modal():''}<button class="fab" onclick="wa()" aria-label="WhatsApp"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 20.5l1.7-5.4A8.5 8.5 0 1 1 21 11.5z"/></svg></button>`;
 if(r=='/')grid();if(r=='/checkout')kurUI()}
addEventListener('hashchange',draw);
try{document.documentElement.dataset.theme=localStorage.getItem('tokotema')||'dark'}catch(e){document.documentElement.dataset.theme='dark'}
function theme(){const t=document.documentElement.dataset.theme=='dark'?'light':'dark';document.documentElement.dataset.theme=t;try{localStorage.setItem('tokotema',t)}catch(e){}draw()}
function wa(){if(!S.wa)return toast('Isi nomor WhatsApp toko di Admin > Pengaturan.');open('https://wa.me/'+S.wa.replace(/\D/g,'')+'?text='+encodeURIComponent('Halo, saya mau tanya produk di Dapur Mama'))}
addEventListener('scroll',()=>{const b=$('#pg'),h=document.documentElement;if(b)b.style.width=(h.scrollTop/((h.scrollHeight-h.clientHeight)||1)*100)+'%'},{passive:true});
addEventListener('storage',()=>{S=load();draw()});
setInterval(()=>{const r=route();if(r.startsWith('/bayar/')||r=='/cek'){S=load();draw()}},5000);
function home(){const cats=['Semua','Pria','Wanita','Anak','Aksesori','Makanan'];
 const fo=S.p.filter(p=>p.t=='makanan'&&tot(p)>0).length,top=[...S.p].sort((a,b)=>b.sold-a.sold||(b.d?1:0)-(a.d?1:0)).slice(0,7);
 return`<section class="hero"><div><span class="pill"><i></i>Fashion &amp; Makanan dari Surabaya</span><h1>Belanja Fashion<br>&amp; Makanan<br><em>Lebih Mudah</em><br><em>&amp; Menyenangkan</em></h1><p>Koleksi pakaian, aksesori, dan makanan rumahan pilihan. Pilih warna dan ukuran, bayar lewat QRIS BCA, dikirim ke seluruh Indonesia.</p><div class="ctas"><button class="btn" onclick="document.getElementById('kat').scrollIntoView()">Lihat Katalog →</button><button class="btn o" onclick="go('/cek')">Cek Pesanan</button></div><div class="bd"><span>🛡 Stok jelas per warna &amp; ukuran</span><span>⚡ Bayar QRIS BCA</span></div></div>
 <div class="gl"><div class="dots"><i></i><i></i><i></i>Dapur Mama · Surabaya</div><div class="or"><small>Menu makanan tersedia hari ini</small><b>${fo} menu</b></div><div class="tls"><div class="tl"><small>Pengiriman</small><b><span class="dt"></span>Seluruh Indonesia</b></div><div class="tl"><small>Gojek instan</small><b><span class="dt"></span>Surabaya</b></div></div><div class="mt">PRODUK PILIHAN</div><div class="strip">${top.map(p=>`<div class="mini" onclick="openP('${p.id}')">${vis(p)}<b>${p.n}</b></div>`).join('')}</div></div></section>
 <div class="sec" id="kat"><span class="pill"><i></i>Katalog Produk</span><h2>Pilih Favoritmu</h2></div><div class="chips">${cats.map(c=>`<div class="chip ${V.cat==c?'on':''}" onclick="V.cat='${c}';draw()">${c}</div>`).join('')}</div><div class="grid" id="grid"></div>`}
function hue(p){return[18,212,32,335,160,205,48,262,12,26,125,6][(+p.id.slice(1)-1)%12]}
function vis(p,c){return`<div class="vis ${p.t}" style="--h:${hue(p)}">${c?`<span class="cat">${p.k}</span>`:''}${p.d?`<span class="off">-${Math.round(100-p.d/p.h*100)}%</span>`:''}<span class="em">${p.e||'🛍️'}</span>${p.img?`<img class="pi" src="${esc(p.img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:''}</div>`}
function grid(){const q=V.q.toLowerCase(),L=S.p.filter(p=>(V.cat=='Semua'||p.k==V.cat)&&p.n.toLowerCase().includes(q));

 else o=`<p>${tot(p)>0?'Sisa hari ini: <b>'+tot(p)+' porsi</b>':'<b class="bad">HABIS HARI INI</b>'}</p><div class="mut">${p.luar?'Tahan lama, bisa dikirim ke luar kota.':'Dikirim via Gojek, khusus Surabaya.'}</div>`;

 const key=f?s.w+'|'+s.u:'porsi',q=Math.max(1,+s.q||1);
 if(S.cart.length&&P(S.cart[0].pid).t!=p.t)return toast('Keranjang berisi '+(p.t=='fashion'?'makanan':'fashion')+'. Selesaikan atau kosongkan dulu.');
 const ex=S.cart.find(c=>c.pid==p.id&&c.key==key),have=ex?ex.q:0;
 if(have+q>avail(p,key))return toast('Stok tidak cukup. Tersedia '+avail(p,key)+'.');

function cart(){const L=lines();if(!L.length)return'<div class="box"><b>Keranjang kosong.</b><p class="mut">Pilih produk di beranda untuk mulai belanja.</p><button class="btn" onclick="go(\'/\')">Lihat produk</button></div>';

 if(S.kurir.Gojek&&z=='sby')o.push({k:'Gojek',fee:15000,e:'Hari ini (instan)'});

 const sub=L.reduce((a,l)=>a+price(l.p)*l.q,0),k=o.find(x=>x.k==V.kur),fee=k?k.fee:0;
 $('#sum').innerHTML=`<div class="row"><span>Subtotal</span><b>${rp(sub)}</b></div><div class="row"><span>Ongkir</span><b>${k?rp(fee):'-'}</b></div><div class="row"><span>Total</span><b class="big">${rp(sub+fee)}</b></div><p class="mut">Pembayaran: QRIS BCA. Kode unik ditambahkan di langkah berikutnya.</p><button class="btn" style="width:100%" onclick="order()">Bayar Sekarang</button>`}
function order(){const L=lines(),v=i=>$('#'+i).value.trim(),nm=v('nm'),wa=v('wa'),al=v('al'),ps=v('ps');
 if(!nm||!/^[0-9+]{9,15}$/.test(wa.replace(/[\s-]/g,''))||al.length<10||!/^\d{5}$/.test(ps)||!V.kota)return toast('Lengkapi nama, WhatsApp, alamat (min. 10 huruf), kota, dan kode pos 5 digit.');
 const k=kur(V.kota,L).find(x=>x.k==V.kur);if(!k)return toast('Pilih kurir dulu.');
 for(const l of L)if(l.q>avail(l.p,l.key))return toast(l.p.n+' stoknya tidak cukup lagi.');
 const sub=L.reduce((a,l)=>a+price(l.p)*l.q,0),total=sub+k.fee,act=S.o.filter(o=>o.status=='menunggu'||o.status=='verifikasi').map(o=>o.tf);let kode,tf;
 do{kode=1+Math.floor(Math.random()*999);tf=total+kode}while(act.includes(tf));
 const food=L[0].p.t=='makanan',inv='INV'+new Date().toISOString().slice(2,10).replace(/-/g,'')+'-'+String(S.o.length+1).padStart(3,'0');
 L.forEach(l=>l.p.v[l.key].r+=l.q);
 S.o.push({inv,t:Date.now(),exp:Date.now()+(food?15:60)*60000,nama:nm,wa,alamat:al,kota:V.kota,pos:ps,cat:v('ct'),kurir:k.k,ongkir:k.fee,sub,total,kode,tf,food,status:'menunggu',resi:'',items:L.map(l=>({pid:l.pid,key:l.key,n:l.p.n,q:l.q,hn:l.p.h,hd:price(l.p)}))});
 S.cart=[];save();go('/bayar/'+inv)}
function qrimg(){return qsrc()?`<img class="qr" src="${esc(qsrc())}" alt="QRIS BCA toko" referrerpolicy="no-referrer">`:`<svg class="qr" viewBox="0 0 100 100"><rect width="100" height="100" fill="#fff"/><g fill="#222">${Array.from({length:225},(_,i)=>(i*7+(i>>4)*5)%3==0?`<rect x="${5+(i%15)*6}" y="${5+(i/15|0)*6}" width="5" height="5"/>`:'').join('')}</g><text x="50" y="52" font-size="7" text-anchor="middle" fill="#a3342b" font-weight="700">GAMBAR CONTOH</text><text x="50" y="60" font-size="5" text-anchor="middle" fill="#a3342b">Unggah QRIS BCA di Admin</text></svg>`}
function pay(inv){const o=S.o.find(x=>x.inv==inv);if(!o)return'<div class="box">Pesanan tidak ditemukan.</div>';
 const head=`<h2>${o.inv}</h2><span class="st">${ST[o.status]}</span>`;
 if(o.status=='menunggu')return`${head}<div class="box" style="text-align:center">${qrimg()}<div class="mut">Transfer tepat sejumlah</div><div class="big">${rp(o.tf)}</div><button class="btn o s" onclick="navigator.clipboard&&navigator.clipboard.writeText('${o.tf}').then(()=>toast('Nominal disalin'))">Salin nominal</button><p class="mut">Scan QRIS BCA, ketik nominal persis ${rp(o.tf)} (termasuk kode unik ${o.kode}). Bayar sebelum ${hm(o.exp)}.</p><button class="btn" style="width:100%" onclick="verif('${o.inv}')">Saya sudah bayar</button></div>`;
 if(o.status=='verifikasi')return`${head}<div class="box">Terima kasih. Penjual sedang mengecek pembayaran Anda. Halaman ini diperbarui otomatis.</div>`;
 if(PAID.includes(o.status))return`${head}<div class="box"><b class="ok">Pembayaran berhasil.</b> Pesanan Anda sedang diproses oleh penjual.<p><button class="btn o s" onclick="printInv('${o.inv}')">Cetak invoice</button></p>${o.resi?`<p>Kurir ${o.kurir}, resi: <b>${esc(o.resi)}</b></p>`:''}</div>`;
 return`${head}<div class="box">Pesanan ini ${ST[o.status].toLowerCase()}. Silakan buat pesanan baru.</div>`}
function verif(inv){const o=S.o.find(x=>x.inv==inv);if(o&&o.status=='menunggu'){o.status='verifikasi';save()}draw()}

async function hs(pw,salt){if(!window.crypto||!crypto.subtle){toast('Browser tidak mendukung. Buka lewat https atau localhost.');throw 0}const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+':'+pw));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function mk(u,pw,r){const sl=[...crypto.getRandomValues(new Uint8Array(8))].map(x=>x.toString(16)).join('');return{u,s:sl,h:await hs(pw,sl),r}}

 const T=m.r=='staf'?{stk:'Stok'}:{ver:'Verifikasi',ord:'Pesanan',kas:'Kasir',stk:'Stok',lap:'Laporan',usr:'Pengguna',set:'Pengaturan'},pend=S.o.filter(o=>o.status=='verifikasi'||o.status=='menunggu').length;

 const d=new Date(o.t).toLocaleString('id-ID',{dateStyle:'long',timeStyle:'short'});
 const rows=o.items.map(i=>`<tr><td>${esc(i.n)}${i.key=='porsi'?'':'<br><small>'+esc(i.key.replace('|',' / '))+'</small>'}</td><td class="r">${i.q}</td><td class="r">${rp(i.hd)}</td><td class="r">${rp(i.hd*i.q)}</td></tr>`).join('');
 w.document.write(`<!doctype html><html lang="id"><head><meta charset="utf-8"><title>Invoice ${esc(o.inv)}</title><style>body{font:14px/1.5 Arial,sans-serif;color:#111;max-width:720px;margin:24px auto;padding:0 16px}h1{margin:0;font-size:26px}.o{color:#ff5a1f}.top{display:flex;justify-content:space-between;border-bottom:3px solid #ff5a1f;padding-bottom:12px;margin-bottom:16px}table{width:100%;border-collapse:collapse;margin:14px 0}th,td{text-align:left;padding:8px;border-bottom:1px solid #ddd}.r{text-align:right}th{background:#f6f1ec}.tot td{border:0;padding:3px 8px}.g{font-size:18px;font-weight:700}.lunas{display:inline-block;border:2px solid #1f8a47;color:#1f8a47;padding:2px 12px;font-weight:700;border-radius:6px}small{color:#666}button{margin:10px 0;padding:8px 16px}@media print{button{display:none}}</style></head><body><div class="top"><div><h1>Dapur <span class="o">Mama</span></h1><small>Surabaya</small></div><div style="text-align:right"><b>INVOICE</b><br>${esc(o.inv)}<br><small>${d}</small></div></div>${o.src=='kasir'?'<p><b>Pembeli:</b> '+esc(o.nama)+'</p>':'<p><b>Kepada:</b><br>'+esc(o.nama)+' · '+esc(o.wa)+'<br>'+esc(o.alamat)+', '+esc(o.kota)+' '+esc(o.pos)+'</p>'}<table><tr><th>Produk</th><th class="r">Jml</th><th class="r">Harga</th><th class="r">Subtotal</th></tr>${rows}</table><table class="tot"><tr><td class="r">Subtotal</td><td class="r" width="140">${rp(o.sub)}</td></tr>${o.src=='kasir'?'':`<tr><td class="r">Ongkir (${esc(o.kurir)})</td><td class="r">${rp(o.ongkir)}</td></tr><tr><td class="r">Kode unik</td><td class="r">${rp(o.kode)}</td></tr>`}<tr class="g"><td class="r">Total</td><td class="r">${rp(o.tf)}</td></tr></table><p>Pembayaran: ${o.src=='kasir'?esc(o.bayar):'QRIS BCA'} · ${PAID.includes(o.status)?'<span class="lunas">LUNAS</span>':ST[o.status]}${o.resi?'<br>Resi '+esc(o.kurir)+': '+esc(o.resi):''}</p><p><small>Terima kasih telah berbelanja di Dapur Mama.</small></p><button onclick="print()">Cetak</button></body></html>`);w.document.close();setTimeout(()=>w.print(),400)}
function aKas(){const L=V.kas||(V.kas=[]),p=P(V.kp)||S.p[0],f=p.t=='fashion',w=f?(p.w.includes(V.kw)?V.kw:p.w[0]):'',u=f?(p.u.includes(V.ku)?V.ku:p.u[0]):'',sub=L.reduce((a,l)=>a+price(P(l.pid))*l.q,0);
 return`<div class="box"><b>Penjualan langsung (kasir)</b><p class="mut">Catat penjualan di toko. Stok langsung berkurang, masuk laporan, dan struk bisa dicetak.</p><label>Barang</label><select onchange="V.kp=this.value;draw()">${S.p.map(x=>`<option value="${x.id}" ${x.id==p.id?'selected':''}>${esc(x.n)} · ${rp(price(x))}</option>`).join('')}</select>${f?`<div class="row"><div style="flex:1"><label>Warna</label><select onchange="V.kw=this.value;draw()">${p.w.map(x=>`<option ${x==w?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div style="flex:1"><label>Ukuran</label><select onchange="V.ku=this.value;draw()">${p.u.map(x=>`<option ${x==u?'selected':''}>${esc(x)}</option>`).join('')}</select></div></div><div class="mut">Stok: ${avail(p,w+'|'+u)}</div>`:`<div class="mut">Sisa porsi: ${tot(p)}</div>`}<label>Jumlah</label><input id="kq" type="number" min="1" value="1"><button class="btn o" style="margin-top:10px" onclick="kAdd('${p.id}','${f?w+'|'+u:'porsi'}')">Tambah ke nota</button></div>
 <div class="box"><b>Nota</b>${L.length?L.map((l,i)=>`<div class="row" style="margin-top:6px"><span>${esc(P(l.pid).n)}${l.key=='porsi'?'':' ('+esc(l.key.replace('|','/'))+')'} ×${l.q}</span><span>${rp(price(P(l.pid))*l.q)} <button class="btn o s" onclick="V.kas.splice(${i},1);draw()">Hapus</button></span></div>`).join(''):'<p class="mut">Belum ada barang.</p>'}<div class="row" style="margin-top:8px"><span>Total</span><b class="big">${rp(sub)}</b></div><label>Nama pembeli (kosong = Cash)</label><input placeholder="Cash" value="${esc(V.kn||'')}" oninput="V.kn=this.value"><label>Pembayaran</label><select onchange="V.kb=this.value">${['Cash','QRIS','Transfer'].map(x=>`<option ${(V.kb||'Cash')==x?'selected':''}>${x}</option>`).join('')}</select><button class="btn" style="width:100%;margin-top:12px" ${L.length?'':'disabled'} onclick="kSave()">Catat &amp; Cetak</button></div>`}
function kAdd(pid,key){const p=P(pid),q=Math.max(1,+$('#kq').value||1),L=V.kas||(V.kas=[]),ex=L.find(l=>l.pid==pid&&l.key==key);if((ex?ex.q:0)+q>avail(p,key))return toast('Stok tidak cukup. Tersedia '+avail(p,key)+'.');if(ex)ex.q+=q;else L.push({pid,key,q});draw()}
function kSave(){const L=V.kas||[],m=me();if(!L.length||!m||m.r!='admin')return;
 for(const l of L)if(l.q>avail(P(l.pid),l.key))return toast(P(l.pid).n+' stoknya tidak cukup lagi.');
 const sub=L.reduce((a,l)=>a+price(P(l.pid))*l.q,0),inv='KSR'+new Date().toISOString().slice(2,10).replace(/-/g,'')+'-'+String(S.o.length+1).padStart(3,'0');
 L.forEach(l=>{const p=P(l.pid);p.v[l.key].s-=l.q;p.sold+=l.q});
 S.o.push({inv,t:Date.now(),paid:Date.now(),src:'kasir',bayar:V.kb||'Cash',nama:(V.kn||'').trim()||'Cash',wa:'-',alamat:'-',kota:'-',pos:'-',cat:'',kurir:'-',ongkir:0,sub,total:sub,kode:0,tf:sub,food:0,status:'selesai',resi:'',items:L.map(l=>{const p=P(l.pid);return{pid:l.pid,key:l.key,n:p.n,q:l.q,hn:p.h,hd:price(p)}})});
 V.kas=[];V.kn='';save();draw();printInv(inv);toast('Penjualan dicatat.')}
function items(o){return o.items.map(i=>`${i.n}${i.key=='porsi'?'':' ('+i.key.replace('|','/')+')'} ×${i.q}`).join(', ')}
function aVer(){const L=S.o.filter(o=>o.status=='verifikasi'||o.status=='menunggu').sort((a,b)=>(a.status=='verifikasi'?0:1)-(b.status=='verifikasi'?0:1));
 return`<p class="mut">Buka KlikBCA, menu Mutasi Rekening, lalu cocokkan nominal persis. Setujui hanya jika uang sudah masuk.</p>`+(L.length?L.map(o=>`<div class="box"><div class="row"><b>${o.inv}</b><span class="st">${ST[o.status]}</span></div>${esc(o.nama)} · ${o.kota}<div class="mut">${esc(items(o))}</div><div class="row" style="margin-top:8px"><span>Total transfer</span><b class="big">${rp(o.tf)}</b></div><label>Nominal masuk di mutasi</label><input id="n${o.inv}" type="number" value="${o.tf}"><div class="row" style="margin-top:10px"><button class="btn g" onclick="approve('${o.inv}')">Setujui</button><button class="btn r" onclick="reject('${o.inv}')">Tolak</button></div></div>`).join(''):'<div class="box">Tidak ada pembayaran yang menunggu.</div>')}
function approve(inv){const o=S.o.find(x=>x.inv==inv);if(!o||!['menunggu','verifikasi'].includes(o.status))return toast('Pesanan ini sudah diproses.');
 if(+$('#n'+inv).value!=o.tf)return toast('Nominal tidak sama dengan total transfer. Cek lagi mutasi.');
 o.items.forEach(i=>{const p=P(i.pid);p.v[i.key].r-=i.q;p.v[i.key].s-=i.q;p.sold+=i.q});o.status='dibayar';o.paid=Date.now();save();draw();toast('Pembayaran disetujui.')}
function reject(inv){const o=S.o.find(x=>x.inv==inv);if(!o||!['menunggu','verifikasi'].includes(o.status))return;rel(o);o.status='dibatalkan';save();draw()}
function aOrd(){const L=S.o.filter(o=>PAID.includes(o.status)).reverse();
 return L.length?L.map(o=>`<div class="box"><div class="row"><b>${o.inv}</b><span class="st">${ST[o.status]}</span></div>${esc(o.nama)} · ${esc(o.wa)}<div class="mut">${o.src=='kasir'?'Penjualan kasir · '+esc(o.bayar):esc(o.alamat)+', '+o.kota+' '+o.pos}</div><div>${esc(items(o))}</div>${o.cat?`<div class="mut">Catatan: ${esc(o.cat)}</div>`:''}<div class="mut">Kurir ${o.kurir} · ${rp(o.total)}${o.food?' · MAKANAN, kirim segera':''}</div><button class="btn o s" style="margin:6px 6px 0 0" onclick="printInv('${o.inv}')">Cetak invoice</button>${o.status=='dibayar'?`<button class="btn s" onclick="setSt('${o.inv}','dikemas')">Mulai dikemas</button>`:''}${o.status=='dikemas'?`<div class="row" style="margin-top:8px"><input id="r${o.inv}" placeholder="Nomor resi / kode order" style="flex:1"><button class="btn s" onclick="setSt('${o.inv}','dikirim')">Tandai dikirim</button></div>`:''}${o.status=='dikirim'?`<div class="mut">Resi: ${esc(o.resi)}</div><button class="btn s" onclick="setSt('${o.inv}','selesai')">Selesai</button>`:''}</div>`).join(''):'<div class="box">Belum ada pesanan yang dibayar.</div>'}
function setSt(inv,s){const o=S.o.find(x=>x.inv==inv);if(s=='dikirim'){const r=$('#r'+inv).value.trim();if(!r)return toast('Isi nomor resi dulu.');o.resi=r}o.status=s;save();draw()}
function aStk(){return(S.api?'<button class="btn o s" onclick="pull(1)">Tarik stok terbaru dari Sheet</button>':'')+S.p.map(p=>p.t=='makanan'?`<div class="box"><div class="row"><b>${p.e} ${p.n}</b><span>${p.habis?'<b class="bad">DITANDAI HABIS</b>':'Tersedia'}</span></div><div class="row" style="margin-top:8px"><div>Sisa porsi dimasak: <input style="width:80px" type="number" min="0" value="${p.v.porsi.s}" onchange="setS('${p.id}','porsi',this.value)"> <span class="mut">dipesan: ${p.v.porsi.r}</span></div><button class="btn s ${p.habis?'g':'r'}" onclick="P('${p.id}').habis=!P('${p.id}').habis;save();draw()">${p.habis?'Tersedia lagi':'Tandai HABIS'}</button></div></div>`:`<div class="box"><b>${p.e} ${p.n}</b><div class="tw"><table><tr>${Object.keys(p.v).map(k=>`<th>${k.replace('|',' / ')}</th>`).join('')}</tr><tr>${Object.keys(p.v).map(k=>`<td><input type="number" min="0" value="${p.v[k].s}" onchange="setS('${p.id}','${k}',this.value)"></td>`).join('')}</tr></table></div></div>`).join('')}
function setS(id,k,v){if(!me())return;P(id).v[k].s=Math.max(0,Math.floor(+v||0));save();draw()}
function aLap(){const O=S.o.filter(o=>PAID.includes(o.status)),d=new Date(),same=(t,f)=>{const x=new Date(t);return x.getFullYear()==d.getFullYear()&&x.getMonth()==d.getMonth()&&(f||x.getDate()==d.getDate())};
 const sum=L=>L.reduce((a,o)=>a+o.sub,0),per={};O.forEach(o=>o.items.forEach(i=>{const e=per[i.n]||(per[i.n]={q:0,r:0});e.q+=i.q;e.r+=i.hd*i.q}));
 const top=Object.entries(per).sort((a,b)=>b[1].q-a[1].q);
 return`<div class="grid"><div class="box"><div class="mut">Omzet hari ini</div><b class="big">${rp(sum(O.filter(o=>same(o.paid))))}</b></div><div class="box"><div class="mut">Omzet bulan ini</div><b class="big">${rp(sum(O.filter(o=>same(o.paid,1))))}</b></div><div class="box"><div class="mut">Pesanan dibayar</div><b class="big">${O.length}</b></div><div class="box"><div class="mut">Menunggu verifikasi</div><b class="big">${S.o.filter(o=>o.status=='verifikasi').length}</b></div></div><div class="box"><b>Produk terlaris</b>${top.length?`<table><tr><th>Produk</th><th>Unit</th><th>Penjualan</th></tr>${top.map(([n,e])=>`<tr><td>${n}</td><td>${e.q}</td><td>${rp(e.r)}</td></tr>`).join('')}</table>`:'<p class="mut">Belum ada penjualan. Buat pesanan lalu setujui pembayarannya.</p>'}</div><div class="box"><b>Stok menipis (3 atau kurang)</b><div class="mut">${S.p.flatMap(p=>Object.keys(p.v).filter(k=>p.t=='fashion'&&p.v[k].s<=3).map(k=>p.n+' '+k.replace('|','/')+': '+p.v[k].s)).join(' · ')||'Aman.'}</div></div>`}
function aSet(){return`${gsBox()}<div class="box"><b>Nomor WhatsApp toko</b><p class="mut">Dipakai tombol WhatsApp melayang. Format: 628123456789.</p><input inputmode="tel" value="${esc(S.wa||'')}" onchange="S.wa=this.value.trim();save()"></div><div class="box"><b>Gambar QRIS BCA toko</b><p class="mut">Tempel link gambar QRIS dari Google Drive (bagikan: Anyone with the link). Pelanggan melihatnya di halaman bayar. Bisa juga diisi di tab Pengaturan Google Sheet.</p><label>Link gambar QRIS</label><input value="${esc(S.qrisUrl||'')}" placeholder="https://drive.google.com/file/d/..." onchange="S.qrisUrl=this.value.trim();save();draw()">${qrimg()}<label>Atau unggah dari perangkat ini (link Drive didahulukan)</label><input type="file" accept="image/*" onchange="upl(this)"></div><div class="box"><b>Kurir aktif</b>${Object.keys(S.kurir).map(k=>`<label style="display:flex;gap:10px;align-items:center;color:var(--ink)"><input type="checkbox" style="width:auto;min-height:0" ${S.kurir[k]?'checked':''} onchange="S.kurir['${k}']=this.checked?1:0;save()">${k}</label>`).join('')}</div><div class="box"><b>Reset data demo</b><p class="mut">Menghapus semua pesanan dan mengembalikan stok awal.</p><button class="btn r s" onclick="if(V.rs){localStorage.removeItem(KEY);S=seed();save();V.rs=0;draw()}else{V.rs=1;toast('Tekan sekali lagi untuk konfirmasi.')}">Reset demo</button></div>`}
function upl(i){const f=i.files[0];if(!f)return;if(f.size>1.5e6)return toast('Gambar maksimal 1,5 MB.');const r=new FileReader();r.onload=()=>{S.qris=r.result;save();draw()};r.readAsDataURL(f)}
pub();setInterval(pub,60000);
draw();
</script></body></html>
