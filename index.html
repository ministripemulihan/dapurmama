const eAkun=e=>e=='Kunci salah'?'Server Google Sheet masih versi lama. Tempel Code.gs terbaru di Apps Script, lalu Deploy > New version.':e;
async function sayaLoad(){try{const r=await pubPost({act:'saya',tok:tk()});if(r.ok){V.sy=r.o;draw()}else if(r.err=='Sesi habis')keluar();else{V.sy=[];draw();toast(eAkun(r.err||'Gagal memuat riwayat.'))}}catch(e){V.syq=0}}
const sayaBox=()=>`<div class="box"><div class="row"><b>Riwayat pesanan saya</b><button class="btn o s" onclick="V.sy=null;V.syq=0;draw()">Muat ulang</button></div>${V.sy==null?'<p class="mut">Memuat…</p>':(V.sy.length?V.sy.map(o=>`<div class="box"><div class="row"><b>${esc(o.inv)}</b><span class="st">${ST[o.s]||esc(o.s)}</span></div><div class="mut">${new Date(o.t).toLocaleString('id-ID',{dateStyle:'medium',timeStyle:'short'})} · ${esc(o.k)}</div><div>${esc(o.i)}</div><div class="row" style="margin-top:6px"><span>Total</span><b>${rp(o.tf)}</b></div>${o.r?`<div class="mut">Resi: <b>${esc(o.r)}</b></div>`:''}</div>`).join(''):'<p class="mut">Belum ada pesanan dari akun ini. Pesanan yang dibuat saat Anda sudah masuk akan muncul di sini.</p>')}</div>`;

/* Banyak perangkat: ambil pesanan baru, status, stok, dan akun terbaru dari Sheet (tiap 20 detik) */
const RK={menunggu:1,verifikasi:2,dibayar:3,dikemas:4,dikirim:5,selesai:6,dibatalkan:7,kedaluwarsa:7};
const idle=()=>{const a=document.activeElement;return !a||!/INPUT|TEXTAREA|SELECT/.test(a.tagName)};
async function poll(silent){const m=me();if(!m||m.r=='customer'||!gk()||!(S.api||API_URL))return 0;if(m.r!='admin')return polStaf(silent);
 try{const kn={};S.o.forEach(o=>kn[o.inv]=o.status);const r=await post({act:'masuk',known:kn});if(!r.ok)return 0;
  const before=JSON.stringify([S.p,S.o,S.users]);let n=0,ch=0;
  (r.add||[]).forEach(o=>{if(S.o.some(x=>x.inv==o.inv))return;o.items.forEach(i=>{const p=P(i.pid);if(p&&p.v[i.key]&&['menunggu','verifikasi'].includes(o.status))p.v[i.key].r+=i.q});S.o.push(o);n++});
  Object.keys(r.upd||{}).forEach(inv=>{const o=S.o.find(x=>x.inv==inv),u=r.upd[inv];if(!o||!((RK[u.s]||0)>(RK[o.status]||0)))return;
   const open=['menunggu','verifikasi'].includes(o.status);
   if(open&&!['menunggu','verifikasi'].includes(u.s))rel(o);
   if(open&&PAID.includes(u.s)){o.items.forEach(i=>{const p=P(i.pid);if(p)p.sold+=i.q});o.paid=o.paid||Date.now()}
   o.status=u.s;if(u.r)o.resi=u.r;if(u.b)o.by=u.b;ch++});
  if(!sync.t&&!push.b){(r.stok||[]).forEach(x=>{const p=P(x[0]);if(p&&p.v[x[1]])p.v[x[1]].s=x[2]});if(r.users&&r.users.length&&JSON.stringify(r.users)!=JSON.stringify(S.users))S.users=r.users}
  if(JSON.stringify([S.p,S.o,S.users])==before)return 0;
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(!silent){if(n)toast(n+' pesanan baru masuk. Cek tab Verifikasi.');else if(ch)toast('Ada pembaruan pesanan dari perangkat lain.');if(idle())draw()}
  if(n)sync();return n+ch+1}catch(e){return 0}}
async function polStaf(silent){if(sync.t||push.b)return 0;
 try{const r=await post({act:'pull'});if(!r.ok||!r.state||!r.state.lim)return 0;const st=r.state,before=JSON.stringify([S.p,S.o]);
  S.p=st.p;S.o=st.o||[];S.users=st.users;if(JSON.stringify([S.p,S.o])==before)return 0;
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(!silent&&idle())draw();return 1}catch(e){return 0}}
/* Pembeli: ikuti status pesanan (disetujui/dikirim) dari Sheet */
async function stat(inv){const o=S.o.find(x=>x.inv==inv),u=S.api||API_URL;if(!o||!u||adm()||['selesai','dibatalkan','kedaluwarsa'].includes(o.status))return;
 try{const r=await fetch(u,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({act:'status',inv})}).then(x=>x.json());if(!r.ok||!r.s||r.s==o.status||r.s=='menunggu')return;
  if(['dibatalkan','kedaluwarsa'].includes(r.s)&&['menunggu','verifikasi'].includes(o.status))rel(o);
  if(r.s=='verifikasi'&&o.status!='menunggu')return;
  o.status=r.s;if(r.r)o.resi=r.r;if(PAID.includes(r.s)&&!o.paid)o.paid=Date.now();localStorage.setItem(KEY,JSON.stringify(S));draw()}catch(e){}}
setInterval(()=>{const r=route();if(r.startsWith('/bayar/'))stat(r.slice(7))},8000);
setInterval(()=>poll(0),20000);
pub();setInterval(pub,60000);loadFaq();setInterval(loadFaq,120000);
draw();
</script></body></html>
